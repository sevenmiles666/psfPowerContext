services:
  seekdb:
    image: oceanbase/seekdb@sha256:4db4961869d554313520d6081fca29265ba6da6db7313311bd8acbed771a956b
    ports:
      - "127.0.0.1:2883:2881"
    environment:
      MEMORY_LIMIT: 2G
      LOG_DISK_SIZE: 2G
    volumes:
      - papertrail-data:/var/lib/seekdb
    restart: unless-stopped
volumes:
  papertrail-data:
